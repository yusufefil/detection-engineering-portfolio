name: Deploy Sentinel Detections
on:
  push:
    branches: [ main ]
    paths: [ 'rules/sigma/**', 'infra/**', 'tooling/**' ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  RG: Luci-Sentinel-Lab
  WORKSPACE: law-sentinel-lab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sigma tooling
        run: pip install sigma-cli pysigma-backend-kusto pyyaml

      - name: Convert Sigma to params
        run: python tooling/sigma_to_sentinel.py

      - name: Convert KQL to params
        run: python tooling/kql_to_sentinel.py

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy analytics rules
        run: |
          for params in build/*.params.json; do
            echo "Deploying $params"
            az deployment group create \
              --resource-group "$RG" \
              --template-file infra/scheduled-rule.bicep \
              --parameters @"$params" workspaceName="$WORKSPACE"
          done
