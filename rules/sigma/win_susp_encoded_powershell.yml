title: Suspicious Encoded PowerShell Command Line
id: 329e0ffc-dc51-4672-8148-d7f83af72e0a
status: experimental
description: Detects powershell.exe launched with an encoded command argument (-enc/-EncodedCommand), commonly used to obfuscate payloads.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Yusuf Efil
date: 2026-06-13
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  condition: selection
falsepositives:
  - Legitimate admin automation using encoded commands
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
